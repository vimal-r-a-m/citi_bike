services:  
  minio:
    image: minio/minio:latest
    container_name: citi_bike_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"  # acessing the minio server
      - "9001:9001"  # acessing the minio console
    volumes:
      - minio_data:/data
    
  # --- Airflow Orchestration ---
  postgres-airflow:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: citibike-airflow:2.9.3
    container_name: airflow_init
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email a@a.com"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./citibike_dbt:/opt/airflow/citibike_dbt
      - ./utils:/opt/airflow/utils
      - ./logs:/opt/airflow/logs

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: citibike-airflow:2.9.3
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    ports: ["8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./citibike_dbt:/opt/airflow/citibike_dbt
      - ./utils:/opt/airflow/utils
      - ./logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: citibike-airflow:2.9.3
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./citibike_dbt:/opt/airflow/citibike_dbt
      - ./utils:/opt/airflow/utils
      - ./logs:/opt/airflow/logs
    command: scheduler

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "9092:9092"

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    depends_on: [redpanda]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    
  gbfs-producer:
    container_name: gbfs-producer
    build:
      context: .
      dockerfile: Dockerfile.producer
    depends_on: [redpanda]
    restart: unless-stopped
  
  postgres-warehouse:
    image: postgres:15
    container_name: warehouse_postgres
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: bikeshare
    ports:
      - "5433:5432"
    volumes:
      - warehouse-db:/var/lib/postgresql/data
  
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark
    depends_on: [redpanda, postgres-warehouse]
    ports:
      - "4040:4040" 
    volumes:
      - ./spark_jobs:/opt/spark_jobs
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      /opt/spark_jobs/station_status_stream.py

volumes:
  minio_data:
  airflow-db:
  redpanda-data:
  warehouse-db: