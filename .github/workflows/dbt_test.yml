name: dbt CI
on:
  pull_request:
    paths:
      - 'citibike_dbt/**'

jobs:
  dbt-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install dbt-duckdb
      - name: Run dbt build against test fixture
        working-directory: ./citibike_dbt
        run: dbt build --target ci